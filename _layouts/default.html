<!DOCTYPE html>
<html lang="{{ page.lang | default: layout.lang | default: site.lang | default: 'en' }}">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include nav.html %}
    <main id="main" class="site-main{% if page.layout == 'post' %} post-main{% endif %}">
      {{ content }}
    </main>
    <footer class="site-footer">{% include footer.html %}</footer>
    {% if page.section == 'about' or page.section == 'publications' %}
    {% include citation-dialog.html %}
    <script src="{{ '/js/citations.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
    {% endif %}
    {% include analytics.html %}
  </body>
</html>
