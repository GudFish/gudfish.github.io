- id: risk-aware-planning
  year: 2026
  title: "Explicit Risk-Aware Belief Space Planning for Underwater Active Cooperative Localization"
  authors: "<strong>Haoyu Liu</strong>, Min Yu, Yuanxiang Wang, Wenkai Zhang, and Qirong Tang"
  venue: "Ocean Engineering"
  citation: >-
    Haoyu Liu, Min Yu, Yuanxiang Wang, Wenkai Zhang, and Qirong Tang*, "Explicit risk-aware belief space planning for underwater active cooperative localization," Ocean Engineering, 346: 123710, 2026.
  abstract: "This work investigates belief-space motion planning for active cooperative localization of autonomous underwater vehicles. It explicitly accounts for uncertainty and collision risk, using an external relaxation of joint chance constraints to support less conservative planning."
