  title: "Parallel Graph Inference for Decentralized and Asynchronous Multi-Robot Cooperative Localization Under Limited Connectivity"
  authors: "Qirong Tang, <strong>Haoyu Liu</strong>, Min Yu, and Yuanxiang Wang"
  venue: "IEEE Robotics and Automation Letters (RA-L)"
  citation: >-
    Qirong Tang, Haoyu Liu, Min Yu, and Yuanxiang Wang*, "Parallel graph inference for decentralized and asynchronous multi-robot cooperative localization under limited connectivity," IEEE Robotics and Automation Letters (RA-L), 11(10): 12120-12127, 2026.
  abstract: "This work studies decentralized cooperative localization for robot teams with limited connectivity. It introduces parallel graph inference to handle asynchronous information exchange, addressing state estimation when inter-robot measurements are delayed or communication is intermittent."
