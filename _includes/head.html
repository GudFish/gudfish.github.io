<head>
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.name | escape }}</title>
  {% include meta.html %}
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.name }} — Blog" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% if page.layout == 'post' %}
  {% if site.gitalk and page.comments %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gitalk@1/dist/gitalk.css">
  <script src="https://cdn.jsdelivr.net/npm/gitalk@1/dist/gitalk.min.js"></script>
  {% endif %}
  <script>window.MathJax = {tex: {inlineMath: [['$', '$'], ['\\(', '\\)']]}, options: {enableMenu: false}};</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
  {% endif %}
</head>
