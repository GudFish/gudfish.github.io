<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% assign description = page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace %}
<meta name="description" content="{{ description | escape }}">
<meta name="author" content="{{ site.name | escape }}">
<meta property="og:site_name" content="{{ site.name | escape }}">
<meta property="og:title" content="{{ page.title | default: site.name | escape }}">
<meta property="og:description" content="{{ description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
