<header class="site-header">
  <div class="header-inner">
    <a class="site-name" href="{{ '/' | relative_url }}" aria-label="Home"><img class="header-logo" src="{{ '/images/shark.png' | relative_url }}" alt="Shark" width="36" height="36"><span class="header-separator" aria-hidden="true"> / </span><span class="header-descriptor">Academic homepage</span></a>
    <nav class="site-nav" aria-label="Main navigation">
      {% for nav in site.navigation %}
      <a href="{{ nav.url | relative_url }}"{% if page.section == nav.section or layout.section == nav.section %} class="active" aria-current="page"{% endif %}>{{ nav.name }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
